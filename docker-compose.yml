version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sandbox-image

  sandbox-image:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: rune-sandbox:latest
    command: ["bash", "-lc", "echo sandbox image ready"]
