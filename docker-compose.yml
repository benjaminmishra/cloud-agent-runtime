version: '3.9'
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sandbox-image

  sandbox-image:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: rune-sandbox:latest
    command: ["bash", "-lc", "echo sandbox image ready"]

volumes:
  caddy_data:
  caddy_config:
